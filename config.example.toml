# 复制为 config.toml 后填写，config.toml 已被 .gitignore 忽略。
# 推荐把真实 Key 放在环境变量中，不要提交到 Git。

[llm]
provider = "openai"
request_timeout_seconds = 90
max_retries = 2

# ---------------------------------------------------------------------------
# [llm.main]：业务侧统一走 OpenAI 兼容 HTTP（memoria/llm/backends/openai_http.py）
#
# A) 远程 API
#   model = "deepseek-v4-flash"
#   api_key = "${DEEPSEEK_API_KEY}"
#   base_url = "https://api.deepseek.com/v1"
#
# B) Windows 推荐：先起本仓库本地服务，再连 HTTP
#   .\.venv\Scripts\python.exe scripts/serve_local_llm.py --model model/Qwen3.5-2B --device cuda --port 8080 --warmup
#   （vLLM/SGLang 官方不支持原生 Windows，可用 WSL2；Ollama 亦可）
#
# C) 进程内兜底（无 HTTP 服务时）：base_url = "local://cuda"
# ---------------------------------------------------------------------------
[llm.main]
model = "model/Qwen3.5-2B"
api_key = ""
base_url = "http://127.0.0.1:8080/v1"
multimodal = false

# [llm.fast] 仍可走远程轻量模型；也可同样改成另一个本地端点。
[llm.fast]
model = "qwen3.6-flash"
api_key = "${DASHSCOPE_API_KEY}"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

[llm.vl]
model = "qwen3.7-plus"
api_key = "${DASHSCOPE_API_KEY}"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

[agent]
system_prompt = "你是 Memoria，用户的长期 AI 伙伴。用与用户相同的语言回答。"
max_tokens = 8192
max_iterations = 20

[agent.context]
memory_window = 40
char_budget = 60000

[agent.skills]
enabled = true
directory = "skills"
max_inject = 2

[agent.tools]
# 启用后，非 always_on 工具经 tool_search + tool_call 按需暴露，避免撑爆上下文。
search_enabled = true
# http_get 仅允许这些主机，供 weather / summarize 等技能使用。
http_allowed_hosts = ["wttr.in", "api.open-meteo.com", "open-meteo.com"]

[agent.mcp]
# 从 JSON 加载外部 MCP server；示例见 mcp_servers.example.json。
enabled = true
config_file = "data/mcp_servers.json"

[agent.drift]
# 空闲时跑限定技能（整理记忆候选等）；默认关闭，按需开启。
enabled = false
min_idle_seconds = 300
interval_seconds = 10800
max_steps = 8
daily_budget = 6
quiet_hours = [0, 1, 2, 3, 4, 5, 6]
allowed_skills = ["drift-digest", "memory-review"]
allow_write_tools = ["memorize"]
timezone = "Asia/Shanghai"

[memory]
enabled = true
engine = ""

[memory.markdown]
enabled = true
directory = "data/markdown"

# ---------------------------------------------------------------------------
# [memory.embedding] 样例：二选一（下面默认启用「本地」）
#
# A) 远程 Embedding API
# [memory.embedding]
# model = "text-embedding-v3"
# api_key = "${DASHSCOPE_API_KEY}"
# base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
#
# B) 进程内本地 BGE（无需 API Key；设备可用 local://cuda | local://cpu | local://auto）
#    下载与环境见 docs/本地Embedding配置.md
# ---------------------------------------------------------------------------
[memory.embedding]
model = "model/bge-small-zh-v1.5"
api_key = ""
base_url = "local://cuda"

[memory.retrieval]
# auto 会优先使用可选 sqlite-vec，未安装时回退 JSON 向量扫描。
vector_backend = "auto"
vector_scan_limit = 2000

[memory.worker]
lease_seconds = 180
max_retries = 3
backoff_seconds = 5

# 分层预算是字符上限（不是精确 token），适合本地单用户运行的调优起点。
# 说明与来源：docs/memory-layers/README.md。共享记忆仍独立使用空间权限。
[memory.layers]
enabled = true
episodic_enabled = true
semantic_chars = 3000
episodic_chars = 1800
procedural_chars = 2400
summary_chars = 2000
catalog_chars = 1200
self_chars = 1200
context_chars = 12000
episode_ttl_days = 90
episode_top_k = 3
episode_max_active = 1000
maintenance_interval_seconds = 3600
retrieval_max_calls = 6
retrieval_max_chars = 12000

[server]
host = "127.0.0.1"
port = 2237

[server.security]
# 留空保持本地免登录；生产环境建议设为 ${MEMORIA_API_TOKEN}。
api_token = ""
allowed_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]
rate_limit_per_minute = 0
max_request_bytes = 1048576

[observability]
metrics_enabled = true

[storage]
database = "data/memoria.db"
